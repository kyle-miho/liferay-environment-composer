jobs:
    test-check-liferay-license:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
                with:
                    submodules: true
            -   uses: actions/setup-java@v4
                with:
                    distribution: zulu
                    java-version: "21"
            -   run: ./scripts/vendor/bats/bin/bats ./scripts/tests/test-check-liferay-license.test.sh
name: Test check Liferay license
on: [workflow_dispatch]