jobs:
    test-elasticsearch:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
                with:
                    submodules: true
            -   uses: actions/setup-java@v4
                with:
                    distribution: zulu
                    java-version: "21"
            -   run: ./scripts/vendor/bats/bin/bats ./scripts/tests/test-elasticsearch.test.sh
name: Test Elasticsearch
on: [workflow_dispatch]